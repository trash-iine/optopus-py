[package]
name = "optopus-py"
version = "0.1.0"
edition = "2024"
rust-version = "1.88" # matches the vendored optopus crate
description = "Python bindings for the optopus combinatorial optimization library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trash-iine/optopus-py"

[lib]
name = "optopus"
crate-type = ["cdylib", "rlib"]

[dependencies]
optopus = { path = "vendor/optopus" }
pyo3 = { version = "0.28.3", features = ["extension-module", "abi3-py39"] }
