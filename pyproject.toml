[build-system]
# PEP 639 metadata (SPDX `license` + `license-files`) requires maturin >= 1.9.3.
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "optopus"
description = "Python bindings for the optopus combinatorial optimization library"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Trash-iine" }]
keywords = [
    "optimization",
    "metaheuristics",
    "simulated-annealing",
    "tabu-search",
    "maxcut",
    "qubo",
    "tsp",
    "sat",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/trash-iine/optopus-py"
Documentation = "https://trash-iine.github.io/optopus-py/"
Repository = "https://github.com/trash-iine/optopus-py"
Issues = "https://github.com/trash-iine/optopus-py/issues"

[tool.maturin]
module-name = "optopus"
features = ["pyo3/extension-module"]

# The runtime wheel targets Python >=3.9 (abi3), but the docs toolchain
# (sphinx 8.x) requires >=3.11. Development happens on a modern interpreter, so
# resolve the dev environment for >=3.11 only.
[tool.uv]
environments = ["python_version >= '3.11'"]

[dependency-groups]
dev = [
    # build
    "maturin>=1.9.3,<2.0",
    # tests
    "pytest>=8",
    # docs
    "sphinx==8.2.3",      # docs generator (myst-parser v4 is not yet supported on sphinx v9+)
    "furo>=2025.12.19",   # docs theme
    "myst-parser>=4.0.1", # author docs in Markdown (MyST)
    # lint / format
    "ruff>=0.16.9",
    # task runner
    "invoke>=2.2.1",
    # git hooks
    "pre-commit>=4.6.2", # runs fast auto-fixing hooks before each commit
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import `tasks.py` from the repository root.
pythonpath = ["."]

[tool.ruff]
# Matches rustfmt's default max_width, so Rust and Python wrap at the same column.
line-length = 100
extend-exclude = [
    "vendor", # the optopus submodule is linted upstream
    "*.md",   # code blocks in the docs are hand-aligned for reading
]

[tool.ruff.lint]
# A bug-finding set rather than "ALL"; see docs/source/adr/0003-adopt-a-moderate-ruff-rule-set.md.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific rules
]
ignore = [
    # Parametrized tests check that several bad inputs each raise ValueError; their
    # messages differ per case, so a single `match=` does not fit.
    "PT011",
]

[tool.ruff.lint.isort]
# The package is built from Rust, so ruff cannot find it on disk to classify it.
known-first-party = ["optopus"]
